<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Portal - We Are Away</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for gorgeous icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-slate-50 via-teal-50/50 to-emerald-100 text-gray-800 flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-white">

    <header class="w-full py-4 px-6 flex justify-between items-center max-w-md mx-auto">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-600 flex items-center justify-center font-bold text-sm shadow-sm">
                <i class="fa-solid fa-house-chimney"></i>
            </div>
            <span class="font-semibold tracking-tight text-xs text-gray-600">Home Doorstep Portal</span>
        </div>
        <div id="currentTime" class="text-xs font-medium px-3 py-1 rounded-full bg-white/80 shadow-sm border border-gray-200/60 text-gray-600">
            --:--
        </div>
    </header>

    <main class="w-full max-w-md mx-auto px-4 py-2 flex-grow flex flex-col justify-center">
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
            
            <!-- Decorative Top Gradient Accent -->
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-emerald-400 via-teal-500 to-indigo-500"></div>

            <!-- Status Header -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 mb-4 shadow-inner ring-4 ring-amber-50">
                    <i class="fa-solid fa-person-walking-luggage text-2xl animate-pulse"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight mb-1 text-gray-900">Sorry if the door is closed or i'm not opening!</h1>
                <p class="text-sm text-gray-600 leading-relaxed">I'm either working or away from home, but you can reach me instantly using the options below.</p>
            </div>

            <div class="space-y-3 mb-6">
                <!-- Phone Call Button -->
                <a href="tel:+916203100120" class="w-full py-3.5 px-5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] transition-all text-white font-semibold flex items-center justify-center space-x-3 shadow-lg shadow-emerald-600/30 group">
                    <div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center group-hover:rotate-12 transition-transform">
                        <i class="fa-solid fa-phone-volume"></i>
                    </div>
                    <span class="text-base tracking-wide">Call Me (Urgent)</span>
                </a>

                <!-- WhatsApp Direct Button -->
                <a href="https://wa.me/916203100120?text=Hi,%20I'm%20at%20your%20doorstep!" target="_blank" class="w-full py-3.5 px-5 rounded-2xl bg-[#25D366] hover:bg-[#20ba5a] active:scale-[0.98] transition-all text-white font-semibold flex items-center justify-center space-x-3 shadow-lg shadow-[#25D366]/30 group">
                    <div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                    </div>
                    <span class="text-base tracking-wide">WhatsApp Me Directly</span>
                </a>
            </div>

            <!-- Divider -->
            <div class="relative flex py-2 items-center mb-5">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-xs uppercase tracking-wider text-gray-400 font-medium">Or leave a quick note</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <form id="visitorForm" onsubmit="sendCustomWhatsApp(event)" class="space-y-3">
                <div>
                    <input type="text" id="visitorName" placeholder="Your Name / Company (e.g., Courier / Friend)" required
                        class="w-full px-4 py-3 rounded-xl bg-white/90 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm transition-all shadow-sm">
                </div>
                <div>
                    <select id="visitReason" class="w-full px-4 py-3 rounded-xl bg-white/90 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm transition-all text-gray-700 shadow-sm">
                         <option value="Neighbor Visit">🤝 Neighbor / Friend Visit</option>
                        <option value="Package / Delivery">📦 Package / Courier Delivery</option>
                        <option value="Service / Maintenance">🔧 Service / Maintenance</option>
                        <option value="Urgent Matter">🚨 Urgent Matter</option>
                        <option value="Other">💬 Other Purpose</option>
                    </select>
                </div>
                <div>
                    <textarea id="visitorMessage" rows="2" placeholder="Quick note (e.g., Left parcel with security / back at 5 PM)" 
                        class="w-full px-4 py-3 rounded-xl bg-white/90 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm transition-all resize-none shadow-sm"></textarea>
                </div>
                <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-gray-900 hover:bg-gray-800 active:scale-[0.98] text-white font-medium text-sm transition-all flex items-center justify-center space-x-2 shadow-md">
                    <i class="fa-solid fa-paper-plane text-emerald-400"></i>
                    <span>Send Details via WhatsApp</span>
                </button>
            </form>

        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-medium flex items-center space-x-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">Opening WhatsApp...</span>
    </div>

    <footer class="w-full py-4 text-center text-xs text-gray-500">
        <p>Secure Doorstep Portal • Powered by QR Code</p>
    </footer>

    <script>
        // Update live clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('currentTime').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Handle custom WhatsApp message builder
        function sendCustomWhatsApp(e) {
            e.preventDefault();
            const name = document.getElementById('visitorName').value.trim();
            const reason = document.getElementById('visitReason').value;
            const message = document.getElementById('visitorMessage').value.trim();

            let fullText = `🔔 *Doorstep Visitor Alert*\n\n*Name:* ${name}\n*Purpose:* ${reason}`;
            if (message) {
                fullText += `\n*Note:* ${message}`;
            }
            fullText += `\n\n_Sent via Home QR Portal_`;

            const encoded = encodeURIComponent(fullText);
            const waUrl = `https://wa.me/916203100120?text=${encoded}`;
            
            showToast("Opening WhatsApp with your details...");
            setTimeout(() => {
                window.open(waUrl, '_blank');
            }, 600);
        }

        // Toast notification helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
